name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 语法编译检查 + 模块导入冒烟
        run: |
          python -m compileall -q . -x 'archive/'
          python -c "import failure_tracking; import shared; print('import ok')"

      - name: 安装依赖
        run: python -m pip install --quiet -r requirements.txt

      # ⚠️ 这一步此前**不存在**：CI 只做语法编译 + 导入冒烟，一条测试都不跑。
      # 后果是「测试写了」≠「CI 执行了」——测试回归可以照样合并。
      # 现在 fresh clone 可复现（不依赖本机 config.json / ab_experiment.db），
      # 所以可以把它作为合并门槛：非 0 必须让 CI 变红。
      - name: 全套测试（fresh clone 可复现）
        run: python -m unittest discover -s tests

      # 打包回归：pyproject 一旦腐化（漏模块 / 入口点写错 / 少了 build-system），
      # 上面「跑源码」的测试**仍然全绿**，只有真装一遍才会红。约 15s。
      # 装在 /tmp 的干净 venv 里、从 /tmp 目录执行，顺带证明引擎不依赖仓库里的
      # config.json（用的是 shared.FALLBACK_CONFIG）。
      - name: 打包冒烟（pip install . + 命令行入口）
        run: |
          python -m venv /tmp/pkg-venv
          /tmp/pkg-venv/bin/python -m pip install --quiet --upgrade pip
          /tmp/pkg-venv/bin/python -m pip install --quiet .
          cd /tmp
          /tmp/pkg-venv/bin/jobhunter-score --help > /dev/null
          /tmp/pkg-venv/bin/jobhunter-score "AI应用工程师" \
            --desc "负责RAG知识库与Agent工作流开发，Python/FastAPI" \
            --company "示例科技" --salary "18-30K" --city 深圳

      # 覆盖率只作**可观测**，不接 codecov、不生成静态 badge（假数字比没有数字更糟）。
      # 发布口径是「跑完把真实数字写进 Job Summary」，所以这里不设 --fail-under：
      # 阈值要基于一串真实 CI 基线再定，拍脑袋定一个只会制造 flaky 红。
      # ⚠️ 用 coverage run 再复跑一遍套件（本地约 +10s），它会把测试的非 0 退出码
      # 透传出来，因此这一步不会把测试失败"盖"成绿。
      - name: 覆盖率（coverage run/report → $GITHUB_STEP_SUMMARY）
        run: |
          python -m pip install --quiet coverage
          coverage run --source=. -m unittest discover -s tests
          coverage report -m > coverage-full.txt
          coverage report -m --include='match_engine.py,deep_filter.py,shared.py' > coverage-engine.txt
          {
            echo '## 测试覆盖率'
            echo ''
            echo '### 评分引擎三模块（match_engine / deep_filter / shared）'
            echo ''
            echo '```'
            cat coverage-engine.txt
            echo '```'
            echo ''
            echo '### 全仓汇总'
            echo ''
            echo '```'
            grep -E '^TOTAL' coverage-full.txt
            echo '```'
            echo ''
            echo '<details><summary>逐文件完整报告（点开）</summary>'
            echo ''
            echo '```'
            cat coverage-full.txt
            echo '```'
            echo ''
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      # 闸门自身也是需要回归测试的代码：「干净仓库是绿的」不构成安全性结论，
      # 唯一证据是「故意放违规内容 → 必然变红」。本用例集自带合成 canary 与夹具
      # 密钥，不读仓库外词表、不依赖本机状态，约 1 秒；每条 FAIL 都断言到 finding
      # 的归属（类别 + 目标文件），不只断言退出码。
      - name: 安全闸门负向测试（违规输入必须变红）
        run: python -m unittest tests.test_pii_gate_negative -v
