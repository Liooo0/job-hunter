name: CI

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 语法编译检查 + 模块导入冒烟
        run: |
          python -m compileall -q . -x 'archive/'
          python -c "import failure_tracking; import shared; print('import ok')"

      - name: 安装依赖
        run: python -m pip install --quiet -r requirements.txt

      # ⚠️ 这一步此前**不存在**：CI 只做语法编译 + 导入冒烟，一条测试都不跑。
      # 后果是「测试写了」≠「CI 执行了」——测试回归可以照样合并。
      # 现在 fresh clone 可复现（不依赖本机 config.json / ab_experiment.db），
      # 所以可以把它作为合并门槛：非 0 必须让 CI 变红。
      - name: 全套测试（fresh clone 可复现）
        run: python -m unittest discover -s tests

      # 闸门自身也是需要回归测试的代码：「干净仓库是绿的」不构成安全性结论，
      # 唯一证据是「故意放违规内容 → 必然变红」。本用例集自带合成 canary 与夹具
      # 密钥，不读仓库外词表、不依赖本机状态，约 1 秒；每条 FAIL 都断言到 finding
      # 的归属（类别 + 目标文件），不只断言退出码。
      - name: 安全闸门负向测试（违规输入必须变红）
        run: python -m unittest tests.test_pii_gate_negative -v
